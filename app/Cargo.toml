[package]
name = "pbf_generator"
version = "1.0.0"
edition = "2024"
description = "PBF Generator"
build = "build.rs"
default-run = "pbf_generator"

[[bin]]
name = "pbf_generator"
path = "src/main.rs"

# Release-signing tool (keygen / sign). Not shipped; see tools/release.ps1.
[[bin]]
name = "pbf_sign"
path = "src/bin/pbf_sign.rs"

[dependencies]
tao = "0.37.2"
wry = "0.57.2"
# Updater: HTTPS via Windows' own TLS (SChannel), Ed25519-signed releases.
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
# pbf_sign only (key generation, wiping the secret key from memory)
zeroize = "1"
getrandom = "0.2"

[build-dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "ico"] }
winresource = "0.1.34"

[package.metadata.winresource]
ProductName = "PBF Generator"
FileDescription = "PBF Generator"
OriginalFilename = "PBF Generator.exe"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
