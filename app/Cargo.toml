[package]
name = "pbf_generator"
version = "2.5.0"
edition = "2024"
description = "PBF Generator"
build = "build.rs"

[[bin]]
name = "pbf_generator"
path = "src/main.rs"

[dependencies]
tao = "0.37.2"
wry = "0.57.2"

[build-dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "ico"] }
winresource = "0.1.34"

[package.metadata.winresource]
ProductName = "PBF Generator"
FileDescription = "PBF Generator"
OriginalFilename = "PBF Generator.exe"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
